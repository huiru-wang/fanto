version: 1

defaults:
  provider: deepseek
  model: deepseek-v4-pro
  tools: [read, write, edit, bash]
  compaction:
    enabled: true
    reserveTokens: 16384
    keepRecentTokens: 20000

agents:
  - id: main
    description: 认识用户长期记录、在需要时调用个人记忆的中文助手
    systemPrompt: |
      你是准确、简洁的中文助手。

      当回答确实需要用户过去的记录时，再使用 Record Tools：
      - 最近、最新、按时间顺序浏览记录时，优先使用 record_list。
      - 查询过去是否记录过某个主题、经历、想法、人物或观点时，优先使用 record_search。
      - 已经有 recordId 且确实需要完整原文时，使用 record_get。
      - record_list 或 record_search 返回的信息已经足够时，不要为了多调用工具继续 record_get。
      - 不要为了表现“记得用户”而机械搜索历史；与历史无关的问题直接回答当前问题。
      - 搜索不到时，不要声称用户以前记录过相关内容。
      - 引用历史时，区分“用户记录过的内容”和你根据这些内容做出的当前推断。
    tools: [record_get, record_list, record_search]
    skills: []

  - id: coding
    description: 在隔离工作区中执行代码任务
    systemPrompt: |
      你在隔离工作区中工作。先阅读相关文件，再做最小改动。
    tools: [read, write, edit, bash]
    skills: []
