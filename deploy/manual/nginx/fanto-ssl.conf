user root;
worker_processes auto;

pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    access_log /var/log/nginx/access.log;

    gzip on;
    client_max_body_size 100m;

    upstream fanto_server {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream fanto_agent {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    # HTTP 强制跳转 HTTPS
    server {
        listen 80;
        listen [::]:80;

        server_name fanto.robinverse.me;

        return 301 https://$host$request_uri;
    }

    # HTTPS 业务入口
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        server_name fanto.robinverse.me;

        ssl_certificate     /etc/nginx/ssl/robinverse.me.pem;
        ssl_certificate_key /etc/nginx/ssl/robinverse.me.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        location = /health {
            proxy_pass http://fanto_server/health;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location = /api/agent {
            proxy_pass http://fanto_agent;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            add_header X-Accel-Buffering no;
        }

        location ^~ /api/agent/ {
            proxy_pass http://fanto_agent;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            add_header X-Accel-Buffering no;
        }

        location /api/ {
            proxy_pass http://fanto_server;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        location ^~ /assets/ {
            root /var/www/fanto-h5;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            root /var/www/fanto-h5;
            try_files $uri $uri/ /index.html;
        }
    }
}