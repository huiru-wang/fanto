<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fanto · Record API 测试台</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17221d;
        --muted: #68766f;
        --line: #dfe6df;
        --paper: #fbfcf8;
        --card: #fff;
        --green: #17745a;
        --green-dark: #0d5943;
        --mint: #e5f5ec;
        --danger: #b33131;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% -10%, #d9f3e4 0, transparent 31rem),
          var(--paper);
        font:
          15px/1.5 ui-rounded,
          "SF Pro Rounded",
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .shell {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 42px 0 64px;
      }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        padding-bottom: 28px;
      }
      .eyebrow {
        margin: 0 0 6px;
        color: var(--green);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 42px);
        line-height: 1.1;
        letter-spacing: -0.04em;
      }
      .intro {
        max-width: 480px;
        margin: 10px 0 0;
        color: var(--muted);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: max-content;
        padding: 8px 12px;
        border: 1px solid #c8e5d5;
        border-radius: 999px;
        color: var(--green-dark);
        background: var(--mint);
        font-size: 13px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.06fr) minmax(320px, 0.94fr);
        gap: 20px;
        align-items: start;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 12px 32px rgba(23, 50, 37, 0.05);
      }
      .composer {
        padding: 24px;
      }
      .list-card {
        overflow: hidden;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 20px 22px;
        border-bottom: 1px solid var(--line);
      }
      h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.02em;
      }
      .settings {
        display: grid;
        grid-template-columns: 1.6fr 1fr auto;
        gap: 10px;
        margin: 0 0 20px;
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #f7faf6;
      }
      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      input,
      textarea {
        width: 100%;
        border: 1px solid #cfd9d1;
        border-radius: 10px;
        color: var(--ink);
        background: white;
        outline: none;
      }
      input {
        height: 38px;
        padding: 0 10px;
      }
      textarea {
        display: block;
        min-height: 144px;
        padding: 14px;
        resize: vertical;
        font-size: 16px;
        line-height: 1.55;
      }
      input:focus,
      textarea:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(23, 116, 90, 0.13);
      }
      .tiny-button,
      .ghost,
      .primary {
        border: 0;
        border-radius: 10px;
        font-weight: 750;
        white-space: nowrap;
      }
      .tiny-button {
        align-self: end;
        height: 38px;
        padding: 0 12px;
        color: var(--green-dark);
        background: #d9f0e3;
      }
      .primary {
        min-height: 46px;
        padding: 0 20px;
        color: #fff;
        background: var(--green);
        box-shadow: 0 6px 14px rgba(23, 116, 90, 0.22);
      }
      .primary:hover {
        background: var(--green-dark);
      }
      .primary:disabled,
      .ghost:disabled {
        cursor: wait;
        opacity: 0.55;
      }
      .ghost {
        padding: 8px 11px;
        color: var(--green-dark);
        background: transparent;
      }
      .attachment-zone {
        margin-top: 16px;
        padding: 14px;
        border: 1px dashed #aac4b3;
        border-radius: 14px;
        background: #f8fcf8;
      }
      .attachment-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .file-button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 36px;
        padding: 0 11px;
        border: 1px solid #c7d9cd;
        border-radius: 9px;
        color: var(--green-dark);
        background: #fff;
        font-weight: 700;
      }
      .file-button input {
        display: none;
      }
      #attachments {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 10px;
        margin-top: 12px;
      }
      .attachment {
        position: relative;
        overflow: hidden;
        min-height: 80px;
        padding: 10px;
        border: 1px solid #d5e3d8;
        border-radius: 10px;
        background: #fff;
      }
      .attachment img {
        display: block;
        width: 100%;
        height: 92px;
        margin-bottom: 7px;
        border-radius: 6px;
        object-fit: cover;
        background: #edf1ed;
      }
      .attachment strong,
      .attachment small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .attachment small {
        color: var(--muted);
        font-size: 11px;
      }
      .remove {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 50%;
        color: #fff;
        background: rgba(22, 34, 29, 0.7);
        font-size: 16px;
        line-height: 1;
      }
      .submit-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 18px;
      }
      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .message {
        display: none;
        margin: 16px 0 0;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 13px;
      }
      .message.show {
        display: block;
      }
      .message.success {
        color: #0e5b42;
        background: #e4f5eb;
      }
      .message.error {
        color: #8b2525;
        background: #feeaea;
      }
      .record-list {
        display: grid;
      }
      .record {
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
      }
      .record:last-child {
        border-bottom: 0;
      }
      .record-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 9px;
        color: var(--muted);
        font-size: 12px;
      }
      .badge {
        padding: 3px 8px;
        border-radius: 999px;
        color: #52675a;
        background: #edf2ed;
        font-weight: 700;
      }
      .badge.processing {
        color: #875800;
        background: #fff1cd;
      }
      .badge.processed {
        color: #116043;
        background: #dff4e8;
      }
      .record-text {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .record-media {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 9px;
        margin-top: 12px;
      }
      .record-media img {
        width: 100%;
        max-height: 156px;
        border-radius: 9px;
        object-fit: cover;
        background: #eef2ef;
      }
      .media-item {
        overflow: hidden;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fafcf9;
      }
      .media-item audio {
        width: 100%;
        margin-top: 4px;
      }
      .media-copy {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
        white-space: pre-wrap;
      }
      .empty,
      .loading {
        padding: 42px 22px;
        color: var(--muted);
        text-align: center;
      }
      .load-more {
        display: block;
        width: calc(100% - 44px);
        margin: 12px 22px 20px;
        padding: 10px;
        border: 1px solid #c6d9ca;
        border-radius: 10px;
        color: var(--green-dark);
        background: #fff;
        font-weight: 750;
      }
      @media (max-width: 820px) {
        header {
          align-items: start;
          flex-direction: column;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 540px) {
        .shell {
          width: min(100% - 20px, 1120px);
          padding-top: 24px;
        }
        .composer {
          padding: 16px;
        }
        .settings {
          grid-template-columns: 1fr;
        }
        .tiny-button {
          width: 100%;
        }
        .submit-row {
          align-items: stretch;
          flex-direction: column;
        }
        .primary {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">Fanto / API playground</p>
          <h1>记录测试台</h1>
          <p class="intro">
            用于验证当前服务端的文本、图片、音频保存及记录列表读取。不会调用整理或脉络接口。
          </p>
        </div>
        <div id="connection" class="status">
          <span class="dot"></span><span>等待连接</span>
        </div>
      </header>
      <section class="grid">
        <section class="card composer" aria-labelledby="compose-title">
          <h2 id="compose-title">新建一条记录</h2>
          <div class="settings">
            <label
              >服务地址<input
                id="api-base"
                value="http://127.0.0.1:3000"
                autocomplete="url"
            /></label>
            <label
              >测试用户 ID<input
                id="user-id"
                value="h5-test-user"
                autocomplete="username"
            /></label>
            <button id="save-settings" class="tiny-button" type="button">
              保存配置
            </button>
          </div>
          <label for="record-text">文本内容</label>
          <textarea
            id="record-text"
            maxlength="20000"
            placeholder="写下一点想法，或只添加媒体…"
          ></textarea>
          <div class="attachment-zone">
            <div class="attachment-actions">
              <label class="file-button"
                >添加图片<input
                  id="image-input"
                  type="file"
                  accept="image/jpeg,image/png,image/webp"
                  multiple
              /></label>
              <button id="start-recording" class="file-button" type="button">
                开始录音
              </button>
              <button
                id="stop-recording"
                class="file-button"
                type="button"
                disabled
              >
                停止录音
              </button>
            </div>
            <p id="recording-status" class="hint" hidden></p>
            <div id="attachments" aria-live="polite"></div>
          </div>
          <div class="submit-row">
            <p class="hint">
              最多 4 个附件；单个文件最大 50 MB。图片支持
              JPEG、PNG、WebP；音频通过麦克风实时录制。
            </p>
            <button id="submit" class="primary" type="button">保存记录</button>
          </div>
          <div id="message" class="message" role="status"></div>
        </section>
        <section class="card list-card" aria-labelledby="list-title">
          <div class="section-head">
            <h2 id="list-title">记录列表</h2>
            <button id="refresh" class="ghost" type="button">刷新</button>
          </div>
          <div id="records" class="record-list">
            <div class="empty">配置服务地址后，将显示该测试用户的记录。</div>
          </div>
          <button id="load-more" class="load-more" type="button" hidden>
            加载更多
          </button>
        </section>
      </section>
    </main>
    <script>
      (() => {
        const supportedTypes = new Set([
          "image/jpeg",
          "image/png",
          "image/webp",
          "audio/mp4",
          "audio/mpeg",
          "audio/wav",
        ]);
        const extensionTypes = {
          m4a: "audio/mp4",
          mp3: "audio/mpeg",
          wav: "audio/wav",
          jpg: "image/jpeg",
          jpeg: "image/jpeg",
          png: "image/png",
          webp: "image/webp",
        };
        const mimeAliases = {
          "audio/x-m4a": "audio/mp4",
          "audio/mp3": "audio/mpeg",
          "audio/x-wav": "audio/wav",
          "image/jpg": "image/jpeg",
        };
        const state = {
          attachments: [],
          cursor: null,
          objectUrls: [],
          recording: null,
        };
        const $ = (selector) => document.querySelector(selector);
        const apiBase = () => $("#api-base").value.trim().replace(/\/$/, "");
        const userId = () => $("#user-id").value.trim();
        const headers = (json) => ({
          "x-user-id": userId(),
          ...(json ? { "Content-Type": "application/json" } : {}),
        });
        const bytes = (value) =>
          value < 1024 * 1024
            ? `${Math.ceil(value / 1024)} KB`
            : `${(value / 1024 / 1024).toFixed(1)} MB`;
        const escapeHtml = (value) =>
          String(value ?? "").replace(
            /[&<>'"]/g,
            (char) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "'": "&#39;",
                '"': "&quot;",
              })[char],
          );
        function setConnection(text, bad = false) {
          const target = $("#connection");
          target.innerHTML = `<span class="dot"></span><span>${escapeHtml(text)}</span>`;
          target.style.color = bad ? "#a32d2d" : "";
          target.style.borderColor = bad ? "#f0caca" : "";
          target.style.background = bad ? "#fff0f0" : "";
        }
        function notify(text, type = "success") {
          const target = $("#message");
          target.textContent = text;
          target.className = `message show ${type}`;
        }
        function clearNotice() {
          $("#message").className = "message";
        }
        function setRecordingUi(text = "") {
          $("#start-recording").disabled = Boolean(state.recording);
          $("#stop-recording").disabled = !state.recording?.recorder;
          const status = $("#recording-status");
          status.hidden = !text;
          status.textContent = text;
        }
        function normalizeType(file) {
          const ext = file.name.split(".").pop().toLowerCase();
          const detected = (file.type || extensionTypes[ext] || "")
            .toLowerCase()
            .split(";")[0];
          return mimeAliases[detected] || extensionTypes[ext] || detected;
        }
        function saveSettings() {
          localStorage.setItem("fanto-record-test-api", apiBase());
          localStorage.setItem("fanto-record-test-user", userId());
          setConnection("配置已保存");
          loadRecords();
        }
        function renderAttachments() {
          const target = $("#attachments");
          target.innerHTML = state.attachments
            .map(
              (item, index) =>
                `<article class="attachment">${item.kind === "image" ? `<img src="${item.preview}" alt="${escapeHtml(item.file.name)}" />` : ""}<strong>${escapeHtml(item.file.name)}</strong><small>${item.kind === "image" ? "图片" : "音频"} · ${bytes(item.file.size)}</small><button class="remove" type="button" data-index="${index}" aria-label="移除 ${escapeHtml(item.file.name)}">×</button></article>`,
            )
            .join("");
          target.querySelectorAll(".remove").forEach((button) =>
            button.addEventListener("click", () => {
              const [removed] = state.attachments.splice(
                Number(button.dataset.index),
                1,
              );
              if (removed.preview) URL.revokeObjectURL(removed.preview);
              renderAttachments();
            }),
          );
        }
        function addFiles(fileList) {
          const candidates = [...fileList];
          for (const file of candidates) {
            const mimeType = normalizeType(file);
            if (!supportedTypes.has(mimeType)) {
              notify(`不支持 ${file.name} 的文件格式。`, "error");
              continue;
            }
            if (file.size > 50_000_000) {
              notify(`${file.name} 超过 50 MB 限制。`, "error");
              continue;
            }
            if (state.attachments.length >= 4) {
              notify("一条记录最多添加 4 个附件。", "error");
              break;
            }
            state.attachments.push({
              file,
              mimeType,
              kind: mimeType.startsWith("image/") ? "image" : "audio",
              preview: mimeType.startsWith("image/")
                ? URL.createObjectURL(file)
                : null,
            });
          }
          renderAttachments();
        }
        function wavFile(audioBuffer) {
          const channels = 1;
          const length = audioBuffer.length;
          const output = new ArrayBuffer(44 + length * 2);
          const view = new DataView(output);
          const write = (offset, value) =>
            view.setUint8(offset, value.charCodeAt(0));
          ["RIFF", "WAVE", "fmt "].forEach((word, index) =>
            [...word].forEach((char, charIndex) =>
              write(index * 4 + charIndex, char),
            ),
          );
          view.setUint32(4, 36 + length * 2, true);
          view.setUint32(16, 16, true);
          view.setUint16(20, 1, true);
          view.setUint16(22, channels, true);
          view.setUint32(24, audioBuffer.sampleRate, true);
          view.setUint32(28, audioBuffer.sampleRate * channels * 2, true);
          view.setUint16(32, channels * 2, true);
          view.setUint16(34, 16, true);
          "data".split("").forEach((char, index) => write(36 + index, char));
          view.setUint32(40, length * 2, true);
          for (let sample = 0; sample < length; sample += 1) {
            let value = 0;
            for (
              let channel = 0;
              channel < audioBuffer.numberOfChannels;
              channel += 1
            )
              value +=
                audioBuffer.getChannelData(channel)[sample] /
                audioBuffer.numberOfChannels;
            view.setInt16(
              44 + sample * 2,
              Math.max(-1, Math.min(1, value)) * 0x7fff,
              true,
            );
          }
          return new File(
            [output],
            `录音-${new Date().toISOString().replace(/[:.]/g, "-")}.wav`,
            { type: "audio/wav" },
          );
        }
        async function addRecording(blob, mimeType) {
          let file;
          if (mimeType === "audio/mp4")
            file = new File(
              [blob],
              `录音-${new Date().toISOString().replace(/[:.]/g, "-")}.m4a`,
              { type: mimeType },
            );
          else {
            const Context = window.AudioContext || window.webkitAudioContext;
            if (!Context)
              throw new Error(
                "当前浏览器无法将录音转换为服务端支持的 WAV 格式。",
              );
            const context = new Context();
            try {
              file = wavFile(
                await context.decodeAudioData(await blob.arrayBuffer()),
              );
            } finally {
              await context.close();
            }
          }
          if (file.size > 50_000_000)
            throw new Error("录音超过 50 MB 限制，请缩短录音后重试。");
          state.attachments.push({
            file,
            mimeType: file.type,
            kind: "audio",
            preview: null,
          });
          renderAttachments();
        }
        async function startRecording() {
          clearNotice();
          if (state.attachments.length >= 4)
            return notify("一条记录最多添加 4 个附件。", "error");
          if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder)
            return notify(
              "当前浏览器不支持实时录音，请使用支持麦克风录制的现代浏览器。",
              "error",
            );
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              audio: true,
            });
            const mimeType = [
              "audio/mp4",
              "audio/webm;codecs=opus",
              "audio/webm",
            ].find((type) => MediaRecorder.isTypeSupported(type));
            const recorder = mimeType
              ? new MediaRecorder(stream, { mimeType })
              : new MediaRecorder(stream);
            const chunks = [];
            state.recording = {
              recorder,
              stream,
              chunks,
              mimeType:
                recorder.mimeType.split(";")[0] || mimeType || "audio/webm",
            };
            recorder.ondataavailable = (event) => {
              if (event.data.size) chunks.push(event.data);
            };
            recorder.onstop = async () => {
              const recording = state.recording;
              state.recording = { preparing: true };
              setRecordingUi("正在准备录音…");
              try {
                if (!recording?.chunks.length)
                  throw new Error("没有录到音频，请重试。");
                await addRecording(
                  new Blob(recording.chunks, { type: recording.mimeType }),
                  recording.mimeType,
                );
                notify("录音已添加，点击“保存记录”即可提交。");
              } catch (error) {
                notify(error.message || "录音处理失败", "error");
              } finally {
                recording?.stream.getTracks().forEach((track) => track.stop());
                state.recording = null;
                setRecordingUi();
              }
            };
            recorder.start();
            setRecordingUi("录音中… 停止后会自动加入本条记录。");
          } catch (error) {
            notify(
              error.name === "NotAllowedError"
                ? "未获得麦克风权限，无法录音。"
                : error.message || "无法开始录音",
              "error",
            );
          }
        }
        function stopRecording() {
          if (state.recording?.recorder?.state === "recording")
            state.recording.recorder.stop();
        }
        async function request(path, options = {}) {
          const response = await fetch(`${apiBase()}${path}`, {
            ...options,
            headers: { ...headers(options.body), ...(options.headers || {}) },
          });
          const payload = await response.json().catch(() => null);
          if (!response.ok || !payload?.success)
            throw new Error(
              payload?.errorMsg || `请求失败（${response.status}）`,
            );
          return payload.result;
        }
        async function mediaCapture(item) {
          if (item.kind === "image") {
            const image = new Image();
            image.src = item.preview;
            await image.decode().catch(() => {});
            return {
              width: image.naturalWidth || undefined,
              height: image.naturalHeight || undefined,
            };
          }
          const audio = document.createElement("audio");
          audio.preload = "metadata";
          audio.src = URL.createObjectURL(item.file);
          try {
            await new Promise((resolve, reject) => {
              audio.onloadedmetadata = resolve;
              audio.onerror = reject;
            });
            return Number.isFinite(audio.duration) && audio.duration > 0
              ? { durationMs: Math.round(audio.duration * 1000) }
              : {};
          } finally {
            URL.revokeObjectURL(audio.src);
          }
        }
        async function upload(item, index, total) {
          setConnection(`正在上传附件 ${index + 1}/${total}`);
          const ticket = await request("/api/uploads", {
            method: "POST",
            body: JSON.stringify({
              mimeType: item.mimeType,
              bytes: item.file.size,
            }),
          });
          const put = await fetch(ticket.uploadUrl, {
            method: "PUT",
            headers: { "Content-Type": item.mimeType },
            body: item.file,
          });
          if (!put.ok)
            throw new Error(`${item.file.name} 上传失败（${put.status}）`);
          const capture = await mediaCapture(item);
          await request(`/api/uploads/${ticket.mediaId}/complete`, {
            method: "POST",
            body: JSON.stringify({ capture }),
          });
          return ticket.mediaId;
        }
        async function submit() {
          clearNotice();
          const text = $("#record-text").value;
          if (!text.trim() && !state.attachments.length)
            return notify("请填写文本或添加至少一个附件。", "error");
          if (state.recording)
            return notify("请先停止录音，并等待录音加入附件。", "error");
          if (!apiBase() || !userId())
            return notify("请先填写服务地址和测试用户 ID。", "error");
          $("#submit").disabled = true;
          try {
            const mediaIds = [];
            for (const [index, item] of state.attachments.entries())
              mediaIds.push(
                await upload(item, index, state.attachments.length),
              );
            setConnection("正在保存记录");
            const record = await request("/api/records", {
              method: "POST",
              body: JSON.stringify({
                text,
                media: mediaIds.map((mediaId) => ({ mediaId })),
                source: "h5-api-test",
              }),
            });
            notify(
              `记录已保存（${record.status}）。媒体理解与音频转写将在服务端异步完成。`,
            );
            $("#record-text").value = "";
            state.attachments.forEach(
              (item) => item.preview && URL.revokeObjectURL(item.preview),
            );
            state.attachments = [];
            renderAttachments();
            await loadRecords();
            setConnection("已连接");
          } catch (error) {
            setConnection("连接或保存失败", true);
            notify(error.message || "保存失败", "error");
          } finally {
            $("#submit").disabled = false;
          }
        }
        async function mediaUrl(mediaId) {
          const response = await fetch(`${apiBase()}/api/media/${mediaId}`, {
            headers: headers(),
          });
          if (!response.ok) throw new Error("媒体不可读取");
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          state.objectUrls.push(url);
          return url;
        }
        async function renderRecord(record) {
          const mediaHtml = await Promise.all(
            (record.media || []).map(async (media) => {
              try {
                const url = await mediaUrl(media.mediaId);
                if (media.type === "image")
                  return `<div class="media-item"><img src="${url}" alt="记录图片" />${media.description ? `<p class="media-copy">${escapeHtml(media.description)}</p>` : ""}</div>`;
                return `<div class="media-item"><audio controls src="${url}"></audio><p class="media-copy">${media.durationMs ? `时长 ${Math.round(media.durationMs / 1000)} 秒` : "音频"}${media.asr?.transcript ? ` · ${escapeHtml(media.asr.transcript)}` : media.asr ? ` · 转写 ${escapeHtml(media.asr.status)}` : ""}</p></div>`;
              } catch {
                return `<div class="media-item"><p class="media-copy">媒体 ${escapeHtml(media.mediaId)} 暂不可读取</p></div>`;
              }
            }),
          );
          const date = new Date(
            record.createdAt || record.updatedAt,
          ).toLocaleString("zh-CN", { hour12: false });
          return `<article class="record"><div class="record-meta"><span>${escapeHtml(date)}</span><span class="badge ${escapeHtml(record.status)}">${escapeHtml(record.status)}</span></div>${record.content?.text ? `<p class="record-text">${escapeHtml(record.content.text)}</p>` : ""}${mediaHtml.length ? `<div class="record-media">${mediaHtml.join("")}</div>` : ""}</article>`;
        }
        async function loadRecords(next = false) {
          if (!apiBase() || !userId()) return;
          const target = $("#records");
          if (!next) {
            state.cursor = null;
            state.objectUrls.forEach(URL.revokeObjectURL);
            state.objectUrls = [];
            target.innerHTML = '<div class="loading">正在读取记录…</div>';
          }
          $("#refresh").disabled = true;
          try {
            const query = new URLSearchParams({ limit: "20" });
            if (next && state.cursor) query.set("cursor", state.cursor);
            const page = await request(`/api/records?${query}`);
            const html = await Promise.all(page.data.map(renderRecord));
            if (next) target.insertAdjacentHTML("beforeend", html.join(""));
            else
              target.innerHTML =
                html.join("") ||
                '<div class="empty">还没有记录，先保存第一条吧。</div>';
            state.cursor = page.nextCursor;
            $("#load-more").hidden = !page.hasMore;
            setConnection("已连接");
          } catch (error) {
            if (!next)
              target.innerHTML = `<div class="empty">读取失败：${escapeHtml(error.message || "未知错误")}</div>`;
            setConnection("服务不可用", true);
          } finally {
            $("#refresh").disabled = false;
          }
        }
        $("#api-base").value =
          localStorage.getItem("fanto-record-test-api") || $("#api-base").value;
        $("#user-id").value =
          localStorage.getItem("fanto-record-test-user") || $("#user-id").value;
        $("#save-settings").addEventListener("click", saveSettings);
        $("#refresh").addEventListener("click", () => loadRecords());
        $("#load-more").addEventListener("click", () => loadRecords(true));
        $("#submit").addEventListener("click", submit);
        $("#image-input").addEventListener("change", (event) => {
          addFiles(event.target.files);
          event.target.value = "";
        });
        $("#start-recording").addEventListener("click", startRecording);
        $("#stop-recording").addEventListener("click", stopRecording);
        loadRecords();
      })();
    </script>
  </body>
</html>
