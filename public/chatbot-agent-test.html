<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fanto · Chatbot Agent Playground</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18211d;
        --muted: #708078;
        --line: #e1e7e2;
        --paper: #f7f9f5;
        --card: rgba(255, 255, 255, 0.92);
        --green: #176e55;
        --green-dark: #0f5843;
        --green-soft: #e7f3ec;
        --user: #173f33;
        --danger: #a43d3d;
        --code: #f3f6f2;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 16% -10%, #dcefe3 0, transparent 32rem),
          radial-gradient(circle at 90% 12%, #eef4df 0, transparent 24rem),
          var(--paper);
        font: 15px/1.55 ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      button, input, textarea { font: inherit; }
      button { cursor: pointer; }

      .shell {
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 34px 0 42px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--green);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 42px);
        line-height: 1.08;
        letter-spacing: -.04em;
      }

      .intro {
        max-width: 610px;
        margin: 9px 0 0;
        color: var(--muted);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: max-content;
        padding: 8px 12px;
        border: 1px solid #cce1d4;
        border-radius: 999px;
        color: var(--green-dark);
        background: var(--green-soft);
        font-size: 13px;
      }

      .status.bad {
        color: var(--danger);
        border-color: #efcccc;
        background: #fff0f0;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }

      .panel {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--card);
        box-shadow: 0 18px 48px rgba(25, 52, 40, .06);
        backdrop-filter: blur(18px);
      }

      .settings {
        display: grid;
        grid-template-columns: 1fr 1fr .72fr .72fr .8fr auto;
        gap: 10px;
        padding: 14px;
        border-bottom: 1px solid var(--line);
        background: rgba(248, 251, 247, .9);
      }

      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 750;
      }

      input, textarea {
        width: 100%;
        border: 1px solid #cfd9d2;
        border-radius: 10px;
        color: var(--ink);
        background: #fff;
        outline: none;
      }

      input {
        height: 38px;
        padding: 0 10px;
        font-size: 13px;
      }

      textarea {
        min-height: 54px;
        max-height: 180px;
        padding: 13px 14px;
        resize: vertical;
        line-height: 1.5;
      }

      input:focus, textarea:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(23, 110, 85, .12);
      }

      .tiny, .ghost, .send {
        border: 0;
        border-radius: 10px;
        font-weight: 760;
        white-space: nowrap;
      }

      .tiny {
        align-self: end;
        height: 38px;
        padding: 0 13px;
        color: var(--green-dark);
        background: #dfeee5;
      }

      .chat-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
      }

      .chat-head strong { font-size: 15px; }
      .session-label {
        margin-left: 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
      }

      .ghost {
        padding: 8px 11px;
        color: var(--green-dark);
        background: transparent;
      }

      .ghost:hover { background: #eef5f0; }

      .transcript {
        min-height: 470px;
        max-height: calc(100vh - 330px);
        overflow-y: auto;
        padding: 26px 22px 30px;
        scroll-behavior: smooth;
      }

      .empty {
        display: grid;
        min-height: 410px;
        place-items: center;
        color: var(--muted);
        text-align: center;
      }

      .empty strong {
        display: block;
        margin-bottom: 7px;
        color: #43534b;
        font-size: 18px;
      }

      .message-row {
        display: flex;
        margin: 0 0 18px;
      }

      .message-row.user { justify-content: flex-end; }
      .message-row.assistant { justify-content: flex-start; }

      .bubble {
        max-width: min(78%, 720px);
        border-radius: 18px;
        word-break: break-word;
      }

      .user .bubble {
        padding: 10px 14px;
        border-bottom-right-radius: 6px;
        color: #fff;
        background: var(--user);
        white-space: pre-wrap;
      }

      .assistant .bubble {
        width: min(82%, 760px);
        padding: 2px 2px 2px 0;
        color: var(--ink);
      }

      .assistant .bubble.streaming::after {
        content: "";
        display: inline-block;
        width: 7px;
        height: 15px;
        margin-left: 3px;
        vertical-align: -2px;
        border-radius: 2px;
        background: #7e9288;
        animation: blink .9s infinite;
      }

      .activity {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 24px;
        color: var(--muted);
        font-size: 13px;
        animation: activity-pulse 1.35s ease-in-out infinite;
      }

      .activity-dots { display: inline-flex; gap: 3px; }
      .activity-dots i {
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: currentColor;
        animation: activity-dot 1.05s ease-in-out infinite;
      }
      .activity-dots i:nth-child(2) { animation-delay: .14s; }
      .activity-dots i:nth-child(3) { animation-delay: .28s; }

      @keyframes blink { 50% { opacity: .18; } }
      @keyframes activity-pulse { 50% { opacity: .62; } }
      @keyframes activity-dot { 50% { opacity: .2; transform: scale(.72); } }

      @media (prefers-reduced-motion: reduce) {
        .activity, .activity-dots i { animation: none; }
      }

      .markdown > :first-child { margin-top: 0; }
      .markdown > :last-child { margin-bottom: 0; }
      .markdown p { margin: 0 0 10px; }
      .markdown ul, .markdown ol { margin: 8px 0 12px; padding-left: 24px; }
      .markdown li + li { margin-top: 4px; }
      .markdown h1, .markdown h2, .markdown h3 {
        margin: 18px 0 8px;
        line-height: 1.28;
        letter-spacing: -.02em;
      }
      .markdown h1 { font-size: 22px; }
      .markdown h2 { font-size: 19px; }
      .markdown h3 { font-size: 17px; }
      .markdown blockquote {
        margin: 12px 0;
        padding: 2px 0 2px 13px;
        border-left: 3px solid #bfd3c5;
        color: #52645a;
      }
      .markdown code {
        padding: 2px 5px;
        border-radius: 5px;
        background: var(--code);
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .markdown pre {
        overflow-x: auto;
        margin: 12px 0;
        padding: 14px;
        border: 1px solid #dfe6e0;
        border-radius: 12px;
        background: var(--code);
      }
      .markdown pre code { padding: 0; background: transparent; }
      .markdown table {
        width: 100%;
        margin: 12px 0;
        border-collapse: collapse;
        font-size: 14px;
      }
      .markdown th, .markdown td {
        padding: 8px 10px;
        border: 1px solid #dce4dd;
        text-align: left;
      }
      .markdown th { background: #f3f7f3; }
      .markdown a { color: var(--green); }
      .markdown img, .media-image {
        display: block;
        width: auto;
        max-width: min(100%, 560px);
        max-height: 430px;
        margin: 12px 0;
        border-radius: 13px;
        object-fit: contain;
        background: #edf1ed;
      }
      .media-audio {
        display: block;
        width: min(100%, 460px);
        margin: 12px 0;
      }
      .media-placeholder {
        display: inline-flex;
        margin: 8px 0;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        color: var(--muted);
        background: #f7faf7;
        font-size: 12px;
      }

      .composer {
        padding: 14px;
        border-top: 1px solid var(--line);
        background: rgba(248, 251, 247, .92);
      }

      .composer-box {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: end;
      }

      .send {
        min-width: 78px;
        height: 46px;
        padding: 0 18px;
        color: #fff;
        background: var(--green);
        box-shadow: 0 6px 16px rgba(23, 110, 85, .2);
      }

      .send:hover { background: var(--green-dark); }
      .send:disabled, .tiny:disabled, .ghost:disabled { cursor: wait; opacity: .52; }

      .hint {
        margin: 7px 2px 0;
        color: var(--muted);
        font-size: 11px;
      }

      .error-line {
        margin: 8px 0 0;
        color: var(--danger);
        font-size: 12px;
      }

      @media (max-width: 860px) {
        header { align-items: start; flex-direction: column; }
        .settings { grid-template-columns: 1fr 1fr; }
        .tiny { width: 100%; }
        .transcript { max-height: none; min-height: 55vh; }
      }

      @media (max-width: 560px) {
        .shell { width: min(100% - 18px, 980px); padding-top: 20px; }
        .settings { grid-template-columns: 1fr; }
        .transcript { padding: 20px 14px 24px; }
        .bubble, .assistant .bubble { max-width: 92%; width: auto; }
        .composer-box { grid-template-columns: 1fr; }
        .send { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">Fanto / Agent Playground</p>
          <h1>Chatbot</h1>
          <p class="intro">用于验证 Fanto 的人格、长期记忆使用方式，以及 Markdown / 图片 / 音频在对话里的最终表现。</p>
        </div>
        <div id="connection" class="status"><span class="dot"></span><span>等待对话</span></div>
      </header>

      <section class="panel">
        <div class="settings">
          <label>Agent Server<input id="agent-base" value="http://127.0.0.1:3001" autocomplete="url" /></label>
          <label>Business Server<input id="business-base" value="http://127.0.0.1:3000" autocomplete="url" /></label>
          <label>Agent ID<input id="agent-id" value="chatbot" autocomplete="off" /></label>
          <label>User ID<input id="user-id" value="h5-test-user" autocomplete="username" /></label>
          <label>Agent Token<input id="agent-token" type="password" placeholder="AGENT_TOKEN" autocomplete="off" /></label>
          <button id="save-settings" class="tiny" type="button">保存配置</button>
        </div>

        <div class="chat-head">
          <div><strong>Fanto</strong><span id="session-label" class="session-label">尚未创建会话</span></div>
          <button id="new-chat" class="ghost" type="button">新对话</button>
        </div>

        <div id="transcript" class="transcript" aria-live="polite"></div>

        <div class="composer">
          <div class="composer-box">
            <textarea id="chat-input" rows="2" maxlength="16000" placeholder="继续和 Fanto 说点什么…"></textarea>
            <button id="send" class="send" type="button">发送</button>
          </div>
          <p class="hint">Enter 发送 · Shift + Enter 换行。当前 Agent：<strong id="agent-id-hint">chatbot</strong>。</p>
          <p id="error-line" class="error-line" hidden></p>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script>
      (() => {
        const $ = (selector) => document.querySelector(selector);
        const state = {
          sessionId: null,
          messages: [],
          running: false,
          mediaUrls: new Set(),
          activity: null,
          activeTools: new Map(),
        };

        const agentBase = () => $("#agent-base").value.trim().replace(/\/$/, "");
        const businessBase = () => $("#business-base").value.trim().replace(/\/$/, "");
        const agentId = () => $("#agent-id").value.trim();
        const userId = () => $("#user-id").value.trim();
        const token = () => $("#agent-token").value.trim();
        const conversationScope = () => `${agentId()}:${userId()}`;
        const sessionKey = () => `fanto-chatbot-session:${conversationScope()}`;
        const messagesKey = () => `fanto-chatbot-messages:${conversationScope()}`;

        const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;",
        })[char]);

        function setConnection(text, bad = false) {
          const target = $("#connection");
          target.className = `status${bad ? " bad" : ""}`;
          target.innerHTML = `<span class="dot"></span><span>${escapeHtml(text)}</span>`;
        }

        function showError(text = "") {
          const target = $("#error-line");
          target.hidden = !text;
          target.textContent = text;
        }

        function agentHeaders(json = true) {
          return {
            Authorization: `Bearer ${token()}`,
            "X-User-Id": userId(),
            ...(json ? { "Content-Type": "application/json" } : {}),
          };
        }

        function saveSettings() {
          localStorage.setItem("fanto-chatbot-agent-base", agentBase());
          localStorage.setItem("fanto-chatbot-business-base", businessBase());
          localStorage.setItem("fanto-chatbot-agent-id", agentId());
          localStorage.setItem("fanto-chatbot-user", userId());
          updateAgentHint();
          restoreConversation();
          setConnection("配置已保存");
        }

        function updateAgentHint() {
          $("#agent-id-hint").textContent = agentId() || "未设置";
        }

        function persistConversation() {
          if (!userId()) return;
          if (state.sessionId) localStorage.setItem(sessionKey(), state.sessionId);
          else localStorage.removeItem(sessionKey());
          const serializable = state.messages.map(({ role, content }) => ({ role, content }));
          localStorage.setItem(messagesKey(), JSON.stringify(serializable));
        }

        function restoreConversation() {
          revokeMediaUrls();
          state.sessionId = userId() ? localStorage.getItem(sessionKey()) : null;
          try {
            const saved = userId() ? JSON.parse(localStorage.getItem(messagesKey()) || "[]") : [];
            state.messages = Array.isArray(saved)
              ? saved.filter((item) => item && ["user", "assistant"].includes(item.role) && typeof item.content === "string")
              : [];
          } catch {
            state.messages = [];
          }
          updateSessionLabel();
          renderTranscript(true);
        }

        function updateSessionLabel() {
          $("#session-label").textContent = state.sessionId ? `Session ${state.sessionId.slice(0, 8)}…` : "尚未创建会话";
        }

        function revokeMediaUrls() {
          state.mediaUrls.forEach((url) => URL.revokeObjectURL(url));
          state.mediaUrls.clear();
        }

        function clearConversation() {
          if (state.running) return;
          revokeMediaUrls();
          state.sessionId = null;
          state.messages = [];
          state.activity = null;
          state.activeTools.clear();
          if (userId()) {
            localStorage.removeItem(sessionKey());
            localStorage.removeItem(messagesKey());
          }
          updateSessionLabel();
          renderTranscript();
          showError();
          setConnection("已开启新对话");
        }

        function mediaPlaceholder(kind, mediaId, label) {
          return `<span class="media-placeholder" data-fanto-kind="${kind}" data-media-id="${mediaId}" data-label="${encodeURIComponent(label || "")}">${kind === "image" ? "正在准备图片…" : "正在准备音频…"}</span>`;
        }

        function prepareMarkdown(raw) {
          return String(raw || "")
            .replace(/!\[([^\]]*)\]\(fanto-media:\/\/([A-Za-z0-9_-]+)\)/g, (_match, alt, id) => mediaPlaceholder("image", id, alt))
            .replace(/\[([^\]]+)\]\(fanto-media:\/\/([A-Za-z0-9_-]+)\)/g, (_match, label, id) => mediaPlaceholder("audio", id, label));
        }

        function markdownHtml(raw) {
          if (!window.marked || !window.DOMPurify) return escapeHtml(raw).replace(/\n/g, "<br />");
          const parsed = window.marked.parse(prepareMarkdown(raw), { gfm: true, breaks: false });
          return window.DOMPurify.sanitize(parsed, { ADD_ATTR: ["data-fanto-kind", "data-media-id", "data-label"] });
        }

        async function mediaUrl(mediaId) {
          const response = await fetch(`${businessBase()}/api/media/${encodeURIComponent(mediaId)}`, {
            headers: { "X-User-Id": userId() },
          });
          if (!response.ok) throw new Error(`媒体不可读取（${response.status}）`);
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          state.mediaUrls.add(url);
          return url;
        }

        async function hydrateMedia(root) {
          const placeholders = [...root.querySelectorAll(".media-placeholder[data-fanto-kind][data-media-id]")];
          await Promise.all(placeholders.map(async (node) => {
            const kind = node.dataset.fantoKind;
            const mediaId = node.dataset.mediaId;
            let label = "";
            try { label = decodeURIComponent(node.dataset.label || ""); } catch { label = ""; }
            try {
              const url = await mediaUrl(mediaId);
              if (kind === "image") {
                const image = document.createElement("img");
                image.className = "media-image";
                image.src = url;
                image.alt = label || "记录图片";
                node.replaceWith(image);
              } else {
                const wrapper = document.createElement("div");
                const audio = document.createElement("audio");
                audio.className = "media-audio";
                audio.controls = true;
                audio.src = url;
                wrapper.append(audio);
                if (label) {
                  const caption = document.createElement("div");
                  caption.className = "hint";
                  caption.textContent = label;
                  wrapper.append(caption);
                }
                node.replaceWith(wrapper);
              }
            } catch (error) {
              node.textContent = error.message || "媒体暂不可读取";
            }
          }));
        }

        function messageHtml(message, index) {
          if (message.role === "user") {
            return `<div class="message-row user" data-message-index="${index}"><div class="bubble">${escapeHtml(message.content)}</div></div>`;
          }
          const activity = state.running && index === state.messages.length - 1 && state.activity
            ? `<div class="activity"><span class="activity-dots"><i></i><i></i><i></i></span><span>${escapeHtml(state.activity)}</span></div>`
            : "";
          return `<div class="message-row assistant" data-message-index="${index}"><div class="bubble markdown${message.streaming && message.content ? " streaming" : ""}">${markdownHtml(message.content)}${activity}</div></div>`;
        }

        function activityForTool(toolName) {
          return ({
            record_search: "正在回忆…",
            record_list: "正在整理最近的记忆…",
            record_get: "正在回看一段记忆…",
          })[toolName] || "正在处理…";
        }

        function showThinking() {
          if (!state.activeTools.size) state.activity = "正在思考…";
        }

        function showMostRecentToolOrThinking() {
          const toolNames = [...state.activeTools.values()];
          state.activity = toolNames.length ? activityForTool(toolNames.at(-1)) : "正在思考…";
        }

        async function renderTranscript(hydrate = false) {
          const target = $("#transcript");
          if (!state.messages.length) {
            target.innerHTML = '<div class="empty"><div><strong>和 Fanto 聊聊</strong><span>试试问它你最近记录过什么，或者继续一个长期话题。</span></div></div>';
            return;
          }
          target.innerHTML = state.messages.map(messageHtml).join("");
          target.scrollTop = target.scrollHeight;
          if (hydrate) {
            const assistantBubbles = [...target.querySelectorAll(".assistant .markdown")];
            await Promise.all(assistantBubbles.map(hydrateMedia));
          }
        }

        async function requestAgent(path, body) {
          const response = await fetch(`${agentBase()}${path}`, {
            method: "POST",
            headers: agentHeaders(true),
            body: JSON.stringify(body),
          });
          const payload = await response.json().catch(() => null);
          if (!response.ok || payload?.success === false) {
            throw new Error(payload?.error || payload?.errorMsg || `请求失败（${response.status}）`);
          }
          return payload?.result;
        }

        async function ensureSession() {
          if (state.sessionId) return state.sessionId;
          const result = await requestAgent("/api/agent/sessions", { agentId: agentId() });
          if (!result?.sessionId) throw new Error("创建 Session 失败：响应中没有 sessionId");
          state.sessionId = result.sessionId;
          updateSessionLabel();
          persistConversation();
          return state.sessionId;
        }

        async function* parseSse(response) {
          if (!response.body) throw new Error("浏览器没有返回可读取的流");
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          for (;;) {
            const { value, done } = await reader.read();
            buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
            for (;;) {
              const match = buffer.match(/\r?\n\r?\n/);
              if (!match || match.index == null) break;
              const block = buffer.slice(0, match.index);
              buffer = buffer.slice(match.index + match[0].length);
              if (!block.trim() || block.trimStart().startsWith(":")) continue;
              let event = "message";
              const data = [];
              for (const line of block.split(/\r?\n/)) {
                if (line.startsWith(":")) continue;
                if (line.startsWith("event:")) event = line.slice(6).trim();
                if (line.startsWith("data:")) data.push(line.slice(5).trimStart());
              }
              yield { event, data: data.join("\n") };
            }
            if (done) break;
          }
        }

        async function sendMessage() {
          if (state.running) return;
          showError();
          const content = $("#chat-input").value.trim();
          if (!content) return;
          if (!agentBase() || !businessBase() || !agentId() || !userId() || !token()) {
            showError("请先填写 Agent Server、Business Server、Agent ID、User ID 和 Agent Token。");
            return;
          }

          state.running = true;
          state.activity = "正在思考…";
          state.activeTools.clear();
          $("#send").disabled = true;
          $("#new-chat").disabled = true;
          $("#chat-input").disabled = true;
          setConnection("Fanto 正在回复…");

          state.messages.push({ role: "user", content });
          const assistant = { role: "assistant", content: "", streaming: true };
          state.messages.push(assistant);
          $("#chat-input").value = "";
          persistConversation();
          await renderTranscript();

          try {
            const sessionId = await ensureSession();
            const response = await fetch(`${agentBase()}/api/agent/stream`, {
              method: "POST",
              headers: agentHeaders(true),
              body: JSON.stringify({ agentId: agentId(), sessionId, message: content }),
            });
            if (!response.ok) {
              const payload = await response.json().catch(() => null);
              throw new Error(payload?.error || payload?.errorMsg || `请求失败（${response.status}）`);
            }

            for await (const item of parseSse(response)) {
              let payload = {};
              if (item.data) {
                try { payload = JSON.parse(item.data); } catch { payload = {}; }
              }
              if (item.event === "delta" && typeof payload.text === "string") {
                state.activity = null;
                assistant.content += payload.text;
                await renderTranscript(false);
              } else if (item.event === "turn_start") {
                showThinking();
                await renderTranscript(false);
              } else if (item.event === "tool_start" && typeof payload.toolCallId === "string" && typeof payload.toolName === "string") {
                state.activeTools.set(payload.toolCallId, payload.toolName);
                showMostRecentToolOrThinking();
                await renderTranscript(false);
              } else if (item.event === "tool_end" && typeof payload.toolCallId === "string") {
                state.activeTools.delete(payload.toolCallId);
                showMostRecentToolOrThinking();
                await renderTranscript(false);
              } else if (item.event === "error") {
                throw new Error(payload.error || "Agent 执行失败");
              } else if (item.event === "done") {
                assistant.streaming = false;
                state.activity = null;
                state.activeTools.clear();
              }
            }

            assistant.streaming = false;
            state.activity = null;
            state.activeTools.clear();
            persistConversation();
            await renderTranscript(true);
            setConnection("已连接");
          } catch (error) {
            assistant.streaming = false;
            if (!assistant.content) {
              state.messages = state.messages.filter((item) => item !== assistant);
            }
            persistConversation();
            await renderTranscript(true);
            showError(error.message || "发送失败");
            setConnection("对话失败", true);
          } finally {
            state.running = false;
            state.activity = null;
            state.activeTools.clear();
            $("#send").disabled = false;
            $("#new-chat").disabled = false;
            $("#chat-input").disabled = false;
            $("#chat-input").focus();
          }
        }

        $("#agent-base").value = localStorage.getItem("fanto-chatbot-agent-base") || $("#agent-base").value;
        $("#business-base").value = localStorage.getItem("fanto-chatbot-business-base") || $("#business-base").value;
        $("#agent-id").value = localStorage.getItem("fanto-chatbot-agent-id") || $("#agent-id").value;
        $("#user-id").value = localStorage.getItem("fanto-chatbot-user") || $("#user-id").value;
        $("#agent-token").value = "";
        updateAgentHint();

        $("#save-settings").addEventListener("click", saveSettings);
        $("#agent-id").addEventListener("input", updateAgentHint);
        $("#new-chat").addEventListener("click", clearConversation);
        $("#send").addEventListener("click", sendMessage);
        $("#chat-input").addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
            event.preventDefault();
            void sendMessage();
          }
        });
        window.addEventListener("beforeunload", revokeMediaUrls);

        restoreConversation();
        $("#chat-input").focus();
      })();
    </script>
  </body>
</html>
